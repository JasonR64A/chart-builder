  <script type="text/babel">
// === infographic.jsx ===
const STAT_LABELS = {
  ops: { label: "OPS", fmt: (v) => v.toFixed(3) },
  woba: { label: "wOBA", fmt: (v) => v.toFixed(3) },
  runsPerGame: { label: "R/G", fmt: (v) => v.toFixed(1) },
  fip: { label: "FIP", fmt: (v) => v.toFixed(2) },
  whip: { label: "WHIP", fmt: (v) => v.toFixed(2) },
  k9: { label: "K/9", fmt: (v) => v.toFixed(1) },
  bb9: { label: "BB/9", fmt: (v) => v.toFixed(1) },
  rangeFactor: { label: "RF", fmt: (v) => v.toFixed(2) },
  wrcPlus: { label: "wRC+", fmt: (v) => Math.round(v).toString() },
};

const PILLARS = {
  hitting: { label: "Hitting", keys: ["ops", "woba", "runsPerGame", "wrcPlus"] },
  pitching: { label: "Pitching", keys: ["fip", "whip", "k9", "bb9"] },
  fielding: { label: "Fielding", keys: ["rangeFactor"] },
};

function pillarPct(stats, keys) {
  const vals = keys.map(k => stats[k] != null ? stats[k].pct : null).filter(v => v != null);
  if (!vals.length) return 0;
  return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
}

function MiniDonut({ pct, label, size = 58 }) {
  const sw = 7;
  const r = (size - sw) / 2;
  const c = 2 * Math.PI * r;
  const dash = ((pct || 0) / 100) * c;
  return (
    <div style={{ textAlign: "center" }}>
      <div style={{ position: "relative", width: size, height: size, margin: "0 auto" }}>
        <svg width={size} height={size}>
          <circle cx={size/2} cy={size/2} r={r} stroke="var(--rule)" strokeWidth={sw} fill="none" />
          <circle cx={size/2} cy={size/2} r={r} stroke="var(--gold-deep)" strokeWidth={sw} fill="none"
            strokeDasharray={`${dash} ${c}`} transform={`rotate(-90 ${size/2} ${size/2})`} strokeLinecap="butt" />
        </svg>
        <div style={{ position: "absolute", inset: 0, display: "grid", placeItems: "center" }}>
          <div className="serif" style={{ fontSize: 15, fontWeight: 700, lineHeight: 1, fontVariantNumeric: "tabular-nums" }}>{pct}</div>
        </div>
      </div>
      <div className="eyebrow" style={{ fontSize: 8, marginTop: 3 }}>{label}</div>
    </div>
  );
}

function Masthead({ team }) {
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingBottom: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
          <img src="__LOGO_WORDMARK__" alt="64 Analytics" style={{ height: 22, display: "block", filter: "var(--logo-filter, none)" }} />
          <div style={{ width: 1, height: 16, background: "var(--rule)" }}></div>
          <div className="eyebrow" style={{ fontSize: 10 }}>NCAAT Resume Dossier</div>
        </div>
        <div className="eyebrow">Vol. {team.year} · Issue {Math.abs(team.name.charCodeAt(0) - 60)}</div>
      </div>
      <hr className="thick" />
      <div style={{ display: "grid", gridTemplateColumns: "auto 1fr auto", gap: 20, alignItems: "end", padding: "18px 0 12px" }}>

function ResumeScore({ team }) {
  const size = 140;
  const r = (size - 10) / 2;
  const c = 2 * Math.PI * r;
  const dash = (team.resumeScore / 100) * c;

  const of = 301;
  const totals = ["q1","q2","q3","q4"].map(k => { const [w,l] = team.quadRecord[k].split("-").map(Number); return {w, l, t: w+l}; });
  const qWins = totals[0].w * 3 + totals[1].w * 2 + totals[2].w + totals[3].w * 0.5;
  const qLoss = totals[0].l * 0.5 + totals[1].l + totals[2].l * 2 + totals[3].l * 3;
  const qWinsPct = Math.max(0, Math.min(100, Math.round((qWins / (qWins + qLoss)) * 130)));
  const sosPct = Math.round((1 - (team.sos.natRank * 0.6 + team.nonConSos.natRank * 0.4) / of) * 100);
  const statsPct = Math.round(Object.values(team.stats).reduce((s, v) => s + v.pct, 0) / Object.keys(team.stats).length);
  const ranks = Object.values(team.rankings);
  const rankAvg = ranks.reduce((a,b)=>a+b,0) / ranks.length;
  const rankingsPct = Math.round((1 - rankAvg / of) * 100);
  const games = team.last10;
  const wins = games.filter(g=>g.result==="W").length;
  const rd = games.reduce((s,g)=>s+(g.rs-g.ra),0);
  const formPct = Math.max(0, Math.min(100, Math.round((wins / 10) * 70 + Math.max(-30, Math.min(30, rd)) + 15)));

  const comps = [
    { label: "Quality Wins", weight: 0.15, pct: qWinsPct, desc: "Weighted by quadrant" },
    { label: "Efficiency", weight: 0.15, pct: statsPct, desc: "Avg. stat percentile" },
    { label: "Schedule", weight: 0.20, pct: sosPct, desc: "Overall & non-con SOS" },
    { label: "Rankings", weight: 0.40, pct: rankingsPct, desc: "Computer consensus" },
    { label: "Recent Form", weight: 0.10, pct: formPct, desc: "Last 10 games" },
  ];
  const computed = Math.round(comps.reduce((s, c) => s + c.pct * c.weight, 0));
  const scale = team.resumeScore / (computed || 1);
  const scaled = comps.map(c => ({ ...c, contrib: c.pct * c.weight * scale }));
  const runningTotals = [];
  scaled.reduce((acc, c) => { const next = acc + c.contrib; runningTotals.push(next); return next; }, 0);

  return (
    <div className="card card-filled" style={{ padding: "14px 16px" }}>
      <div style={{ display: "grid", gridTemplateColumns: "auto 1fr auto", gap: 20, alignItems: "center", paddingBottom: 10, borderBottom: "1px solid var(--rule)" }}>
        <div style={{ position: "relative", width: size, height: size }}>
          <svg width={size} height={size}>
            <circle cx={size/2} cy={size/2} r={r} stroke="var(--rule)" strokeWidth="9" fill="none" />
            <circle cx={size/2} cy={size/2} r={r} stroke={team.colors.primary} strokeWidth="9" fill="none"
              strokeDasharray={`${dash} ${c}`} transform={`rotate(-90 ${size/2} ${size/2})`} strokeLinecap="butt" />
          </svg>
          <div style={{ position: "absolute", inset: 0, display: "grid", placeItems: "center" }}>
            <div className="serif" style={{ fontSize: 42, fontWeight: 600, lineHeight: 1, fontVariantNumeric: "tabular-nums" }}>{team.resumeScore}</div>
          </div>
        </div>
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
            <img src="__LOGO_EMBLEM__" alt="64A" style={{ height: 14, width: 14, display: "block" }} />
            <div className="eyebrow">Resume Score · 64A Composite</div>
          </div>
          <div className="serif" style={{ fontSize: 22, fontWeight: 500, lineHeight: 1.15, letterSpacing: "-0.01em", marginBottom: 8, maxWidth: 380 }}>
            Five weighted inputs combine to one composite — the sum of the parts.
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6 }}>
            <MiniStat label="Projected" value={team.seedProjection} />
            <MiniStat label="Verdict" value={team.bubbleVerdict} accent />
          </div>
        </div>
        <div style={{ textAlign: "center", borderLeft: "1px solid var(--rule)", paddingLeft: 20 }}>
          <div className="eyebrow" style={{ marginBottom: 2 }}>Grade</div>
          <div className="serif" style={{ fontSize: 68, fontWeight: 500, lineHeight: 0.85, color: team.colors.primary, fontStyle: "italic" }}>{team.grade}</div>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "128px 1fr 36px 50px 44px 44px", gap: 8, padding: "6px 0 4px", borderBottom: "1px solid var(--rule)" }}>
        <div className="eyebrow" style={{ fontSize: 8 }}>Category</div>
        <div className="eyebrow" style={{ fontSize: 8 }}>Raw Percentile</div>
        <div className="eyebrow" style={{ fontSize: 8, textAlign: "right" }}>%ILE</div>
        <div className="eyebrow" style={{ fontSize: 8, textAlign: "right" }}>× Wt</div>
        <div className="eyebrow" style={{ fontSize: 8, textAlign: "right" }}>= Pts</div>
        <div className="eyebrow" style={{ fontSize: 8, textAlign: "right" }}>Total</div>
      </div>
      {scaled.map((c, i) => (
        <div key={i} style={{ display: "grid", gridTemplateColumns: "128px 1fr 36px 50px 44px 44px", gap: 8, alignItems: "center", padding: "5px 0", borderBottom: "1px solid var(--rule)" }}>
          <div>
            <div className="serif" style={{ fontSize: 13, fontWeight: 600, lineHeight: 1.1 }}>{c.label}</div>
            <div className="mono" style={{ fontSize: 8, color: "var(--muted)", marginTop: 1 }}>{c.desc}</div>
          </div>
          <div style={{ position: "relative", height: 10, background: "var(--paper)" }}>
            <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${c.pct}%`, background: "var(--gold-deep)" }}></div>
            {[0.25, 0.5, 0.75].map(t => <div key={t} style={{ position: "absolute", left: `${t*100}%`, top: -1, bottom: -1, width: 1, background: "var(--rule)" }}></div>)}
          </div>
          <div className="mono" style={{ fontSize: 11, fontWeight: 700, textAlign: "right", color: c.pct >= 80 ? "var(--win)" : c.pct >= 50 ? "var(--ink)" : "var(--loss)" }}>{c.pct}</div>
          <div className="mono" style={{ fontSize: 11, textAlign: "right", color: "var(--muted)", fontWeight: 600 }}>{Math.round(c.weight*100)}%</div>
          <div className="serif" style={{ fontSize: 14, fontWeight: 600, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>{c.contrib.toFixed(1)}</div>
          <div className="mono" style={{ fontSize: 10, textAlign: "right", color: "var(--muted)", fontWeight: 600, fontVariantNumeric: "tabular-nums" }}>{runningTotals[i].toFixed(1)}</div>
        </div>
      ))}
      <div style={{ display: "grid", gridTemplateColumns: "128px 1fr 36px 50px 44px 44px", gap: 8, alignItems: "baseline", padding: "6px 0 2px", borderTop: "2px solid var(--rule-strong)" }}>
        <div className="mono" style={{ fontSize: 9, fontWeight: 700, letterSpacing: "0.1em", color: "var(--ink)" }}>FINAL SCORE</div>
        <div></div>
        <div></div>
        <div className="mono" style={{ fontSize: 10, textAlign: "right", color: "var(--muted)", fontWeight: 700 }}>100%</div>
        <div className="serif" style={{ fontSize: 18, fontWeight: 700, textAlign: "right", color: "var(--gold-deep)", fontVariantNumeric: "tabular-nums" }}>{team.resumeScore}</div>
        <div className="mono" style={{ fontSize: 9, textAlign: "right", color: "var(--muted)", fontWeight: 600 }}>/ 100</div>
      </div>
    </div>
  );
}

function SpiderChart({ team, size = 240 }) {
  const stats = team.stats;
  const keys = Object.keys(stats);
  const cx = size/2, cy = size/2, r = size * 0.36;
  const angleFor = (i) => (Math.PI * 2 * i) / keys.length - Math.PI / 2;

  const pointsFor = (pctMap) => keys.map((k, i) => {
    const a = angleFor(i);
    const pct = pctMap[k];
    const rr = ((typeof pct === "number" ? pct : 0) / 100) * r;
    return [cx + Math.cos(a) * rr, cy + Math.sin(a) * rr];
  });

  const teamPctMap = Object.fromEntries(keys.map(k => [k, stats[k].pct]));
  const teamPts = pointsFor(teamPctMap);

  const neighbors = (team.nearestByScore || []).filter(n => n && n.stats);

  return (
    <svg viewBox={`0 0 ${size} ${size}`} width="100%" style={{ display: "block", maxWidth: size + 60 }}>
      {[0.25, 0.5, 0.75, 1].map((g, gi) => {
        const pts = keys.map((_, i) => {
          const a = angleFor(i);
          return [cx + Math.cos(a)*r*g, cy + Math.sin(a)*r*g];
        });
        return <polygon key={gi} points={pts.map(p=>p.join(",")).join(" ")} fill="none" stroke="var(--rule)" strokeWidth={g===1?1:0.6} />;
      })}
      {keys.map((_, i) => {
        const a = angleFor(i);
        return <line key={i} x1={cx} y1={cy} x2={cx+Math.cos(a)*r} y2={cy+Math.sin(a)*r} stroke="var(--rule)" strokeWidth="0.5" />;
      })}
      {neighbors.map((n, ni) => {
        const pts = pointsFor(n.stats);
        return (
          <polygon key={`n-${ni}`}
            points={pts.map(p=>p.join(",")).join(" ")}
            fill="none"
            stroke="var(--ink-2)"
            strokeOpacity="0.28"
            strokeWidth="1"
            strokeDasharray="2,2" />
        );
      })}
      <polygon points={teamPts.map(p=>p.join(",")).join(" ")} fill="var(--gold-deep)" fillOpacity="0.25" stroke="var(--gold-deep)" strokeWidth="1.75" />
      {teamPts.map((p, i) => <circle key={i} cx={p[0]} cy={p[1]} r="2.5" fill="var(--gold-deep)" stroke="var(--paper)" strokeWidth="1" />)}
      {keys.map((k, i) => {
        const a = angleFor(i);
        const lr = r + 14;
        const lx = cx + Math.cos(a)*lr;
        const ly = cy + Math.sin(a)*lr;
        let anchor = "middle";
        if (Math.cos(a) > 0.25) anchor = "start";
        else if (Math.cos(a) < -0.25) anchor = "end";
        return (
          <text key={k} x={lx} y={ly} textAnchor={anchor} dominantBaseline="middle"
            fontFamily="JetBrains Mono" fontSize="8" fontWeight="600" fill="var(--ink)" letterSpacing="0.06em">
            {STAT_LABELS[k].label.toUpperCase()}
          </text>
        );
      })}
    </svg>
  );
}

function SpiderModule({ team }) {
  const neighbors = (team.nearestByScore || []).slice().sort((a,b) => Math.abs(a.diff) - Math.abs(b.diff));
  const teamArea = team.statArea != null ? team.statArea : null;
  return (
    <Module num="01" title="Statistical Profile" eyebrow="Percentile Ranks vs. D-I">
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, alignItems: "start" }}>
        <div>
          <SpiderChart team={team} size={200} />
          <div style={{ display: "flex", gap: 12, justifyContent: "center", marginTop: 4 }}>
            <Legend color="var(--gold-deep)" label={team.name} />
            <Legend color="var(--ink-2)" label="Neighbors" dashed />
          </div>
          {teamArea != null && (
            <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 6, alignItems: "baseline", marginTop: 6, padding: "4px 6px", background: "var(--paper-2)", border: "1px solid var(--rule)" }}>
              <div className="eyebrow" style={{ fontSize: 8 }}>Radar Area · overall stat index</div>
              <div className="serif" style={{ fontSize: 16, fontWeight: 700, color: "var(--gold-deep)", fontVariantNumeric: "tabular-nums" }}>{teamArea}</div>
            </div>
          )}
          <div style={{ marginTop: 6, paddingTop: 6, borderTop: "1px solid var(--rule)" }}>
            <div style={{ display: "grid", gridTemplateColumns: "1fr auto auto auto auto", gap: 6, paddingBottom: 2, borderBottom: "1px dotted var(--rule)" }}>
              <div className="eyebrow">Nearest by Resume Score</div>
              <div className="eyebrow" style={{ fontSize: 8, textAlign: "right" }}>SCORE</div>
              <div className="eyebrow" style={{ fontSize: 8, textAlign: "right" }}>Δ</div>
              <div className="eyebrow" style={{ fontSize: 8, textAlign: "right", minWidth: 24 }}>AREA</div>
              <div className="eyebrow" style={{ fontSize: 8, textAlign: "right", minWidth: 28 }}>Δ-AREA</div>
            </div>
            {neighbors.map((n, i) => {
              const area = n.statArea != null ? n.statArea : null;
              // Flip perspective: positive = current team stronger than neighbor.
              const areaDiff = (area != null && teamArea != null) ? (teamArea - area) : null;
              const areaColor = areaDiff == null ? "var(--muted)" : areaDiff > 0 ? "var(--win)" : areaDiff < 0 ? "var(--loss)" : "var(--muted)";
              const diffTeamPerspective = -n.diff;  // same flip: + = current team scores higher
              return (
                <div key={i} style={{ display: "grid", gridTemplateColumns: "1fr auto auto auto auto", gap: 6, padding: "2px 0", alignItems: "baseline" }}>
                  <div className="serif" style={{ fontSize: 11, fontWeight: 600, lineHeight: 1.15 }}>{n.team} <span className="mono" style={{ fontSize: 8, color: "var(--muted)", fontWeight: 500 }}>· {n.conf}</span></div>
                  <div className="serif" style={{ fontSize: 12, fontWeight: 600, fontVariantNumeric: "tabular-nums", textAlign: "right" }}>{n.score}</div>
                  <div className="mono" style={{ fontSize: 9, fontWeight: 700, color: diffTeamPerspective > 0 ? "var(--win)" : diffTeamPerspective < 0 ? "var(--loss)" : "var(--muted)", textAlign: "right" }}>{diffTeamPerspective > 0 ? "+" : ""}{diffTeamPerspective}</div>
                  <div className="mono" style={{ fontSize: 10, fontWeight: 700, textAlign: "right" }}>{area != null ? area : "-"}</div>
                  <div className="mono" style={{ fontSize: 10, fontWeight: 700, textAlign: "right", color: areaColor, fontVariantNumeric: "tabular-nums" }}>{areaDiff == null ? "-" : (areaDiff > 0 ? `+${areaDiff}` : `${areaDiff}`)}</div>
                </div>
              );
            })}
          </div>
        </div>
        <div style={{ fontSize: 11 }}>
          {Object.keys(team.stats).map((k) => {
            const s = team.stats[k];
            return (
              <div key={k} style={{ display: "grid", gridTemplateColumns: "42px 1fr 32px", gap: 6, padding: "3px 0", borderBottom: "1px solid var(--rule)", alignItems: "center" }}>
                <div className="mono" style={{ fontSize: 9, fontWeight: 700, color: "var(--ink-2)" }}>{STAT_LABELS[k].label}</div>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <div className="serif" style={{ fontSize: 12, fontWeight: 600, fontVariantNumeric: "tabular-nums", minWidth: 42 }}>{STAT_LABELS[k].fmt(s.value)}</div>
                  <div style={{ flex: 1, height: 4, background: "var(--paper-2)", position: "relative" }}>
                    <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${s.pct}%`, background: "var(--gold-deep)" }}></div>
                  </div>
                </div>
                <div className="mono" style={{ fontSize: 10, fontWeight: 700, textAlign: "right", color: s.pct >= 80 ? "var(--win)" : s.pct >= 50 ? "var(--ink)" : "var(--loss)" }}>{s.pct}</div>
              </div>
            );
          })}
          <div style={{ marginTop: 10, paddingTop: 8, borderTop: "1px solid var(--rule)" }}>
            <div className="eyebrow" style={{ marginBottom: 6 }}>Pillar Breakdown · Avg Percentile</div>
            <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 6 }}>
              {Object.entries(PILLARS).map(([k, p]) => (
                <MiniDonut key={k} pct={pillarPct(team.stats, p.keys)} label={p.label} />
              ))}
            </div>
          </div>
        </div>
      </div>
    </Module>
  );
}

function SOSModule({ team }) {
  const quads = [
    { k: "q1", desc: "H 1-25 · N 1-40 · A 1-60", accent: 1.0 },
    { k: "q2", desc: "H 26-50 · N 41-80 · A 61-120", accent: 0.75 },
    { k: "q3", desc: "H 51-100 · N 81-160 · A 121-240", accent: 0.5 },
    { k: "q4", desc: "H 101+ · N 161+ · A 241+", accent: 0.3 },
  ];
  const totals = ["q1","q2","q3","q4"].map(k => { const [w,l] = team.quadRecord[k].split("-").map(Number); return {w, l, t: w+l}; });
  const totalG = totals.reduce((s,t) => s + t.t, 0);
  const top2W = totals[0].w + totals[1].w;
  const top2G = totals[0].t + totals[1].t;
  const top2Pct = top2G ? Math.round(top2W/top2G*100) : 0;

  return (
    <Module num="02" title="Strength of Schedule" eyebrow="Overall & Non-Conference">
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 8 }}>
        <SOSPanel label="Overall" rank={team.sos.natRank} of={team.sos.of} tier={team.sos.tier} />
        <SOSPanel label="Non-Con" rank={team.nonConSos.natRank} of={team.nonConSos.of} tier={team.nonConSos.tier} />
      </div>
      <div className="eyebrow" style={{ marginBottom: 5 }}>Quadrant Record · Win-Loss Distribution</div>
      <div style={{ display: "grid", gap: 3 }}>
        {quads.map((q, i) => {
          const rec = team.quadRecord[q.k];
          const [w, l] = rec.split("-").map(Number);
          const tot = w + l || 1;
          const wPct = (w/tot) * 100;
          const max = Math.max(...totals.map(t=>t.t));
          const widthPct = (tot / max) * 100;
          return (
            <div key={q.k} style={{ display: "grid", gridTemplateColumns: "20px 1fr 58px", gap: 6, alignItems: "center" }}>
              <div className="mono" style={{ fontSize: 9, fontWeight: 700, color: `rgba(139,111,62,${q.accent})`, letterSpacing: "0.08em" }}>Q{i+1}</div>
              <div style={{ position: "relative", height: 16, background: "var(--paper-2)", width: `${widthPct}%` }}>
                <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${wPct}%`, background: "var(--win)", opacity: 0.85 }}></div>
                <div style={{ position: "absolute", left: `${wPct}%`, top: 0, bottom: 0, right: 0, background: "var(--loss)", opacity: 0.8 }}></div>
                <div style={{ position: "absolute", inset: 0, display: "flex", justifyContent: "space-between", padding: "0 5px", alignItems: "center" }}>
                  <span className="mono" style={{ fontSize: 9, color: "white", fontWeight: 700 }}>{w > 0 ? w : ""}</span>
                  <span className="mono" style={{ fontSize: 9, color: "white", fontWeight: 700 }}>{l > 0 ? l : ""}</span>
                </div>
              </div>
              <div style={{ textAlign: "right" }}>
                <span className="serif" style={{ fontSize: 12, fontWeight: 600, fontVariantNumeric: "tabular-nums" }}>{rec}</span>
                <span className="mono" style={{ fontSize: 8, color: "var(--muted)", marginLeft: 3 }}>{Math.round(wPct)}%</span>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6, marginTop: 8 }}>
        <div style={{ padding: "5px 7px", background: "var(--paper-2)", border: "1px solid var(--rule)", textAlign: "center" }}>
          <div className="eyebrow" style={{ fontSize: 8 }}>Games</div>
          <div className="serif" style={{ fontSize: 18, fontWeight: 600, fontVariantNumeric: "tabular-nums", lineHeight: 1 }}>{totalG}</div>
        </div>
        <div style={{ padding: "5px 7px", background: "var(--paper-2)", border: "1px solid var(--rule)", textAlign: "center" }}>
          <div className="eyebrow" style={{ fontSize: 8 }}>Q1+Q2 W%</div>
          <div className="serif" style={{ fontSize: 18, fontWeight: 600, color: "var(--gold-deep)", fontVariantNumeric: "tabular-nums", lineHeight: 1 }}>{top2Pct}%</div>
        </div>
        <div style={{ padding: "5px 7px", background: "var(--paper-2)", border: "1px solid var(--rule)", textAlign: "center" }}>
          <div className="eyebrow" style={{ fontSize: 8 }}>Top-25 Wins</div>
          <div className="serif" style={{ fontSize: 18, fontWeight: 600, fontVariantNumeric: "tabular-nums", lineHeight: 1 }}>{totals[0].w}</div>
        </div>
      </div>
      <div className="serif" style={{ marginTop: 6, paddingTop: 5, borderTop: "1px solid var(--rule)", fontSize: 10, color: "var(--muted)", lineHeight: 1.4, fontStyle: "italic" }}>
        {team.sos.natRank <= 15 && team.nonConSos.natRank <= 50
          ? `Elite both ways — ${team.name} earned every win against a top-tier slate.`
          : team.nonConSos.natRank > 100
            ? `Strong in conference, but the soft non-con will cost seed-line points.`
            : `Solid, if unspectacular, across the board.`}
      </div>
      {team.remainingQuadSchedule && (
        <div style={{ marginTop: 6, paddingTop: 5, borderTop: "1px solid var(--rule)" }}>
          <div className="eyebrow" style={{ marginBottom: 4 }}>Remaining Schedule · By Quadrant</div>
          <div style={{ display: "grid", gap: 4 }}>
            {["q1","q2","q3","q4"].map((k, i) => {
              const games = team.remainingQuadSchedule[k] || [];
              const accents = [1.0, 0.75, 0.5, 0.3];
              if (!games.length) return null;
              return (
                <div key={k} style={{ display: "grid", gridTemplateColumns: "18px 1fr", gap: 6, alignItems: "baseline", padding: "2px 0", borderBottom: "1px dotted var(--rule)" }}>
                  <div className="mono" style={{ fontSize: 9, fontWeight: 700, color: `rgba(139,111,62,${accents[i]})`, letterSpacing: "0.08em" }}>Q{i+1}</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                    {games.map((g, gi) => {
                      const prefix = g.venue === "home" ? "vs" : g.venue === "neutral" ? "n" : "@";
                      return (
                        <span key={gi} className="mono" style={{ fontSize: 9, color: "var(--ink-2)", fontWeight: 600 }}>
                          {prefix} {g.opp}
                          {g.oppRank != null && <span style={{ color: "var(--muted)", fontWeight: 500 }}> #{g.oppRank}</span>}
                        </span>
                      );
                    })}
                  </div>
                </div>
              );
            })}
            {["q1","q2","q3","q4"].every(k => !(team.remainingQuadSchedule[k] && team.remainingQuadSchedule[k].length)) && (
              <div className="mono" style={{ fontSize: 9, color: "var(--muted)", fontStyle: "italic" }}>No remaining games on the schedule.</div>
            )}
          </div>
        </div>
      )}
    </Module>
  );
}

function SOSPanel({ label, rank, of, tier }) {
  const pct = 1 - rank / of;
  return (
    <div style={{ padding: 8, background: "var(--paper-2)", border: "1px solid var(--rule)" }}>
      <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between" }}>
        <div className="eyebrow">{label}</div>
        <div className="mono" style={{ fontSize: 8, padding: "1px 5px", border: "1px solid var(--gold-deep)", color: "var(--gold-deep)", fontWeight: 600 }}>{tier.toUpperCase()}</div>
      </div>
      <div style={{ display: "flex", alignItems: "baseline", gap: 6, margin: "4px 0 6px" }}>
        <div className="serif" style={{ fontSize: 30, fontWeight: 500, lineHeight: 1, fontVariantNumeric: "tabular-nums" }}>#{rank}</div>
        <div className="mono" style={{ fontSize: 9, color: "var(--muted)" }}>of {of}</div>
      </div>
      <div style={{ height: 4, background: "var(--paper)" }}>
        <div style={{ width: `${pct*100}%`, height: "100%", background: "var(--gold-deep)" }}></div>
      </div>
    </div>
  );
}

function RankingsModule({ team }) {
  const systems = [
    { key: "rpi", label: "RPI", desc: "Traditional" },
    { key: "dsr", label: "DSR", desc: "Diamond Sports Rating" },
    { key: "massey", label: "MASSEY", desc: "Predictive" },
    { key: "elo", label: "ELO", desc: "WarrenNolan" },
    { key: "64a", label: "64A", desc: "Our composite" },
  ];
  const ranks = systems.map(s => team.rankings[s.key]);
  const avg = Math.round(ranks.reduce((a,b)=>a+b,0) / ranks.length);
  const hi = Math.min(...ranks), lo = Math.max(...ranks);
  const of = 301;
  return (
    <Module num="03" title="Computer Consensus" eyebrow="Five systems, one opinion">
      {systems.map((s) => {
        const rank = team.rankings[s.key];
        const pct = 1 - rank/of;
        return (
          <div key={s.key} style={{ display: "grid", gridTemplateColumns: "74px 1fr 32px", gap: 8, alignItems: "center", padding: "4px 0", borderBottom: "1px solid var(--rule)" }}>
            <div>
              <div className="mono" style={{ fontSize: 9, letterSpacing: "0.1em", color: "var(--ink-2)", fontWeight: 700, lineHeight: 1.1 }}>{s.label}</div>
              <div className="mono" style={{ fontSize: 7.5, color: "var(--muted)", letterSpacing: "0.05em", marginTop: 1 }}>{s.desc}</div>
            </div>
            <div style={{ position: "relative", height: 6, background: "var(--paper-2)" }}>
              <div style={{ position: "absolute", left: 0, top: 0, bottom: 0, width: `${pct*100}%`, background: "var(--gold-deep)" }}></div>
              {[0.25, 0.5, 0.75].map(t => <div key={t} style={{ position: "absolute", left: `${t*100}%`, top: -1, bottom: -1, width: 1, background: "var(--rule)" }}></div>)}
            </div>
            <div className="serif" style={{ fontSize: 14, fontWeight: 600, textAlign: "right", fontVariantNumeric: "tabular-nums", lineHeight: 1 }}>#{rank}</div>
          </div>
        );
      })}
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6, marginTop: 8 }}>
        <div style={{ padding: "6px 8px", background: "var(--paper-2)", border: "1px solid var(--rule)", textAlign: "center" }}>
          <div className="eyebrow" style={{ fontSize: 8 }}>Avg</div>
          <div className="serif" style={{ fontSize: 20, fontWeight: 600, color: "var(--gold-deep)", fontVariantNumeric: "tabular-nums", lineHeight: 1 }}>#{avg}</div>
        </div>
        <div style={{ padding: "6px 8px", background: "var(--paper-2)", border: "1px solid var(--rule)", textAlign: "center" }}>
          <div className="eyebrow" style={{ fontSize: 8 }}>Best</div>
          <div className="serif" style={{ fontSize: 20, fontWeight: 600, fontVariantNumeric: "tabular-nums", lineHeight: 1 }}>#{hi}</div>
        </div>
        <div style={{ padding: "6px 8px", background: "var(--paper-2)", border: "1px solid var(--rule)", textAlign: "center" }}>
          <div className="eyebrow" style={{ fontSize: 8 }}>Worst</div>
          <div className="serif" style={{ fontSize: 20, fontWeight: 600, fontVariantNumeric: "tabular-nums", lineHeight: 1 }}>#{lo}</div>
        </div>
      </div>
      <div className="serif" style={{ marginTop: 8, paddingTop: 6, borderTop: "1px solid var(--rule)", fontSize: 10, color: "var(--muted)", lineHeight: 1.45, fontStyle: "italic" }}>
        {lo - hi <= 4
          ? `Tight consensus — all five systems agree within a ${lo - hi}-spot band. No outlier propping this team up.`
          : lo - hi <= 8
            ? `Moderate spread. The ${lo - hi}-spot gap suggests the predictive and resume-based views diverge.`
            : `Wide ${lo - hi}-spot spread — systems disagree sharply on where this team belongs.`}
      </div>
      {team.projectedRpiRange && (
        <div style={{ marginTop: 6, paddingTop: 6, borderTop: "1px solid var(--rule)", display: "grid", gridTemplateColumns: "1fr auto", gap: 6, alignItems: "baseline" }}>
          <div className="eyebrow">Projected Final RPI · Band</div>
          <div className="serif" style={{ fontSize: 15, fontWeight: 700, color: "var(--gold-deep)", fontVariantNumeric: "tabular-nums" }}>
            #{team.projectedRpiRange[0]} – #{team.projectedRpiRange[1]}
          </div>
        </div>
      )}
    </Module>
  );
}

function PaceModule({ team }) {
  const games = team.last10;
  const width = 480, height = 230, padL = 30, padR = 10, padT = 14, padB = 68;
  const maxR = Math.max(...games.flatMap(g=>[g.rs,g.ra])) + 1;
  const stepX = (width-padL-padR)/games.length;
  const y = (v) => padT + (1 - v/maxR)*(height-padT-padB);
  const rs = games.reduce((s,g)=>s+g.rs,0);
  const ra = games.reduce((s,g)=>s+g.ra,0);
  const wins = games.filter(g=>g.result==="W").length;

  let cum = 0;
  const cumPts = games.map((g, i) => { cum += (g.rs - g.ra); return { i, val: cum }; });
  const cumMax = Math.max(...cumPts.map(p=>Math.abs(p.val))) || 1;
  const diffH = 42;
  const diffY = (v) => diffH/2 - (v / cumMax) * (diffH/2 - 4);

  return (
    <Module num="04" title="Last 10 Games" eyebrow="Runs scored vs. allowed · cumulative run differential">
      <svg viewBox={`0 0 ${width} ${height}`} width="100%" style={{ display: "block" }}>
        {[0, 3, 6, 9, 12, 15].filter(v => v <= maxR).map(v => (
          <g key={v}>
            <line x1={padL} x2={width-padR} y1={y(v)} y2={y(v)} stroke="var(--rule)" strokeWidth="0.5" strokeDasharray={v===0?"0":"2,3"} />
            <text x={padL-4} y={y(v)} textAnchor="end" dominantBaseline="middle" fontFamily="JetBrains Mono" fontSize="8" fill="var(--muted)">{v}</text>
          </g>
        ))}
        {games.map((g, i) => {
          const cx = padL + stepX*(i+0.5);
          const w = Math.min(18, stepX*0.42);
          const hi = Math.max(g.rs, g.ra), lo = Math.min(g.rs, g.ra);
          const win = g.result==="W";
          const fill = win ? "var(--win)" : "var(--loss)";
          return (
            <g key={i}>
              <line x1={cx} x2={cx} y1={y(0)} y2={y(hi)} stroke="var(--ink)" strokeOpacity="0.15" strokeWidth="0.8" />
              <rect x={cx-w/2} y={y(hi)} width={w} height={y(lo)-y(hi)} fill={fill} fillOpacity="0.85" stroke={fill} />
              <line x1={cx-w/2-3} x2={cx-w/2} y1={y(g.rs)} y2={y(g.rs)} stroke="var(--ink)" strokeWidth="1.2" />
              <line x1={cx+w/2} x2={cx+w/2+3} y1={y(g.ra)} y2={y(g.ra)} stroke="var(--ink)" strokeWidth="1.2" />
              <text x={cx} y={y(hi)-4} textAnchor="middle" fontFamily="JetBrains Mono" fontSize="8" fontWeight="700" fill={fill}>{g.result}</text>
              <text x={cx} y={height-padB+8} textAnchor="end" fontFamily="JetBrains Mono" fontSize="8" fontWeight="600" fill="var(--ink-2)"
                    transform={`rotate(-45 ${cx} ${height-padB+8})`}>{(g.home?"vs ":g.oppRank===0?"n ":"@ ")+g.opp}</text>
              <text x={cx} y={height-12} textAnchor="middle" fontFamily="JetBrains Mono" fontSize="7" fill="var(--muted)">#{g.oppRank}</text>
            </g>
          );
        })}
        <text x={padL-4} y={padT} textAnchor="end" fontFamily="JetBrains Mono" fontSize="8" fill="var(--muted)" letterSpacing="0.1em">R</text>
      </svg>

      <div style={{ marginTop: 6, paddingTop: 6, borderTop: "1px solid var(--rule)" }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 3 }}>
          <div className="eyebrow">Cumulative Run Differential</div>
          <div className="mono" style={{ fontSize: 9, color: "var(--muted)" }}>final: <span style={{ color: cumPts[cumPts.length-1].val>=0?"var(--win)":"var(--loss)", fontWeight: 700 }}>{cumPts[cumPts.length-1].val>=0?"+":""}{cumPts[cumPts.length-1].val}</span></div>
        </div>
        <svg viewBox={`0 0 ${width} ${diffH}`} width="100%" style={{ display: "block" }}>
          <line x1={padL} x2={width-padR} y1={diffH/2} y2={diffH/2} stroke="var(--rule)" strokeWidth="0.75" strokeDasharray="2,2" />
          <polyline
            fill="none"
            stroke="var(--gold-deep)"
            strokeWidth="1.75"
            points={cumPts.map((p,i) => `${padL + stepX*(i+0.5)},${diffY(p.val)}`).join(" ")}
          />
          {cumPts.map((p,i) => (
            <circle key={i} cx={padL + stepX*(i+0.5)} cy={diffY(p.val)} r="2" fill="var(--gold-deep)" stroke="var(--paper)" strokeWidth="1" />
          ))}
        </svg>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 6, marginTop: 6 }}>
        <PaceStat label="Record" val={`${wins}-${games.length-wins}`} />
        <PaceStat label="RS" val={rs} sub={`${(rs/games.length).toFixed(1)}/g`} />
        <PaceStat label="RA" val={ra} sub={`${(ra/games.length).toFixed(1)}/g`} />
        <PaceStat label="Diff" val={(rs-ra>=0?"+":"")+(rs-ra)} accent={rs-ra>=0?"var(--win)":"var(--loss)"} />
      </div>
    </Module>
  );
}

function PaceStat({ label, val, sub, accent }) {
  return (
    <div style={{ padding: "4px 6px", background: "var(--paper-2)", border: "1px solid var(--rule)" }}>
      <div className="eyebrow" style={{ fontSize: 8 }}>{label}</div>
      <div className="serif" style={{ fontSize: 17, fontWeight: 600, lineHeight: 1, color: accent || "var(--ink)", fontVariantNumeric: "tabular-nums" }}>{val}</div>
      {sub && <div className="mono" style={{ fontSize: 8, color: "var(--muted)", marginTop: 1 }}>{sub}</div>}
    </div>
  );
}

function AnalogsModule({ team }) {
  return (
    <Module num="05" title="Historical Analogs" eyebrow="Nearest neighbors, 2021-2025">
      <div style={{ display: "grid", gridTemplateColumns: "14px 1fr 36px 40px 54px 1fr 40px 40px", gap: 6, padding: "3px 0", borderBottom: "1px solid var(--rule)" }}>
        <div className="eyebrow" style={{ fontSize: 8 }}>#</div>
        <div className="eyebrow" style={{ fontSize: 8 }}>TEAM</div>
        <div className="eyebrow" style={{ fontSize: 8, textAlign: "right" }}>RPI</div>
        <div className="eyebrow" style={{ fontSize: 8, textAlign: "right" }}>SCORE</div>
        <div className="eyebrow" style={{ fontSize: 8 }}>SEED</div>
        <div className="eyebrow" style={{ fontSize: 8 }}>FINISH</div>
        <div className="eyebrow" style={{ fontSize: 8, textAlign: "right" }}>NCAAT</div>
        <div className="eyebrow" style={{ fontSize: 8, textAlign: "right" }}>SCORE Δ</div>
      </div>
      {team.analogs.map((a, i) => {
        const delta = a.scoreDelta != null ? a.scoreDelta : 0;
        const deltaText = delta === 0 ? "0" : (delta > 0 ? `+${delta}` : `${delta}`);
        const deltaColor = delta > 0 ? "var(--win)" : delta < 0 ? "var(--loss)" : "var(--muted)";
        const seedText = a.seed != null && a.seed <= 16
          ? `#${a.seed}`
          : (a.regionalSeed != null ? `${a.regionalSeed}-seed` : "-");
        const wlText = (a.ncaatWins != null && a.ncaatLosses != null)
          ? `${a.ncaatWins}-${a.ncaatLosses}` : "-";
        return (
          <div key={i} style={{ display: "grid", gridTemplateColumns: "14px 1fr 36px 40px 54px 1fr 40px 40px", gap: 6, padding: "5px 0", borderBottom: i===team.analogs.length-1?"none":"1px solid var(--rule)", alignItems: "center" }}>
            <div className="serif" style={{ fontSize: 13, fontStyle: "italic", color: "var(--gold-deep)" }}>{i+1}</div>
            <div>
              <div className="serif" style={{ fontSize: 13, fontWeight: 600, lineHeight: 1.1 }}>{a.team}</div>
              <div className="mono" style={{ fontSize: 8, color: "var(--muted)" }}>{a.year}</div>
            </div>
            <div className="mono" style={{ fontSize: 10, fontWeight: 700, textAlign: "right", color: "var(--ink-2)" }}>{a.rpi != null ? `#${a.rpi}` : "-"}</div>
            <div className="serif" style={{ fontSize: 13, fontWeight: 600, fontVariantNumeric: "tabular-nums", textAlign: "right" }}>{a.score}</div>
            <div className="mono" style={{ fontSize: 10, fontWeight: 600 }}>{seedText}</div>
            <div className="serif" style={{ fontSize: 11, fontWeight: 600, color: a.result.includes("Champion") || a.result.includes("Finalist") ? "var(--win)" : "var(--ink-2)", lineHeight: 1.1 }}>{a.result}</div>
            <div className="mono" style={{ fontSize: 10, fontWeight: 700, textAlign: "right", fontVariantNumeric: "tabular-nums" }}>{wlText}</div>
            <div className="mono" style={{ fontSize: 11, fontWeight: 700, textAlign: "right", color: deltaColor, fontVariantNumeric: "tabular-nums" }}>{deltaText}</div>
          </div>
        );
      })}
    </Module>
  );
}

function VerdictModule({ team }) {
  return (
    <Module num="06" title="The Verdict" eyebrow="Quality wins & resume drags" fill>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
        <div>
          <div className="eyebrow" style={{ color: "var(--win)", marginBottom: 4 }}>Signature Wins</div>
          {team.bigWins.map((w, i) => (
            <div key={i} style={{ fontSize: 11, padding: "3px 0", borderBottom: i===team.bigWins.length-1?"none":"1px dotted var(--rule)" }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span className="serif" style={{ fontWeight: 600 }}>{w.opp}</span>
                <span className="mono" style={{ fontWeight: 600, color: "var(--win)" }}>{w.score}</span>
              </div>
              <div className="mono" style={{ fontSize: 8, color: "var(--muted)" }}>{w.note}</div>
            </div>
          ))}
        </div>
        <div>
          <div className="eyebrow" style={{ color: "var(--loss)", marginBottom: 4 }}>Resume Drags</div>
          {team.badLosses.length === 0 ? (
            <div className="serif" style={{ fontSize: 11, fontStyle: "italic", color: "var(--muted)" }}>None of note.</div>
          ) : team.badLosses.map((w, i) => (
            <div key={i} style={{ fontSize: 11, padding: "3px 0", borderBottom: i===team.badLosses.length-1?"none":"1px dotted var(--rule)" }}>
              <div style={{ display: "flex", justifyContent: "space-between" }}>
                <span className="serif" style={{ fontWeight: 600 }}>{w.opp}</span>
                <span className="mono" style={{ fontWeight: 600, color: "var(--loss)" }}>{w.score}</span>
              </div>
              <div className="mono" style={{ fontSize: 8, color: "var(--muted)" }}>{w.note}</div>
            </div>
          ))}
        </div>
      </div>
    </Module>
  );
}

function Footer({ team }) {
  return (
    <div style={{ marginTop: 12 }}>
      <hr className="thick" />
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", paddingTop: 8, gap: 16 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
          <img src="__LOGO_EMBLEM__" alt="64A" style={{ height: 20, width: 20, display: "block" }} />
          <div className="eyebrow" style={{ fontSize: 9 }}>64 Analytics · Published {team.year}</div>
        </div>
        <div style={{ flex: 1 }}></div>
        <div className="eyebrow" style={{ fontSize: 9 }}>64analytics.com</div>
      </div>
    </div>
  );
}

function Infographic({ team }) {
  return (
    <div className="page">
      <Masthead team={team} />
      <div style={{ marginTop: 14 }}>
        <ResumeScore team={team} />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1.25fr 1fr", gap: 12, marginTop: 12 }}>
        <SpiderModule team={team} />
        <div style={{ display: "grid", gap: 12 }}>
          <SOSModule team={team} />
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1.4fr", gap: 12, marginTop: 12 }}>
        <RankingsModule team={team} />
        <PaceModule team={team} />
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1.3fr 1fr", gap: 12, marginTop: 12 }}>
        <AnalogsModule team={team} />
        <VerdictModule team={team} />
      </div>
      <Footer team={team} />
    </div>
  );
}

window.Infographic = Infographic;
  </script>

  <script type="text/babel">
// === app.jsx ===
const TWEAK_DEFAULTS = {
  "team": "__INITIAL_TEAM__",
  "theme": "__INITIAL_THEME__"
};

function App() {
  const state = TWEAK_DEFAULTS;
  React.useEffect(() => {
    document.body.setAttribute("data-theme", state.theme);
  }, [state.theme]);
  const team = window.TEAMS[state.team] || window.TEAMS.vanderbilt;
  return <Infographic team={team} />;
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
  </script>
</body>
</html>
